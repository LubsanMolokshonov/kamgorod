<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><rect width="1000" height="700" fill="white"/><g font-family="Arial,sans-serif" fill="#123153"><text x="50" y="50" font-size="27">Развёртка: 19 × 10 см</text><rect x="50" y="90" width="855" height="230" fill="#edf5ff" stroke="#123153" stroke-width="3"/><rect x="860" y="90" width="45" height="230" fill="#c8d9ec"/><path d="M320 90v230M590 90v230M860 90v230" stroke="#376c9d" stroke-width="3" stroke-dasharray="10 8"/><g font-size="25" text-anchor="middle"><text x="185" y="127">6 см</text><text x="455" y="127">6 см</text><text x="725" y="127">6 см</text><text x="883" y="75">1 см</text><text x="185" y="230">Основание</text><text x="455" y="230">Рисунок ↻</text><text x="725" y="230">Задняя стенка</text></g><text x="945" y="215" font-size="24" transform="rotate(90 945 215)">10 см</text><text x="50" y="370" font-size="23">Поверните лист: верх и низ рисунка — вдоль сгибов.</text><text x="50" y="415" font-size="23">Клапан вклеивается внутрь у свободного края основания.</text><text x="570" y="485" font-size="25">Вид сбоку</text><path d="M180 640L300 432L420 640Z" fill="#edf5ff" stroke="#123153" stroke-width="4"/><path d="M380 636h35" stroke="#6c8cab" stroke-width="7"/><text x="270" y="677" font-size="22">6 см</text><text x="570" y="530" font-size="22">Три панели замыкаются</text><text x="570" y="565" font-size="22">в треугольное основание.</text><text x="570" y="615" font-size="22">Рисунок остаётся снаружи.</text></g></svg>